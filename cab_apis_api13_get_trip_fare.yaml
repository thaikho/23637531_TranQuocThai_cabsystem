openapi: 3.0.0
info:
  title: CAB System API - API13
  summary: Tính cước sau khi hoàn thành chuyến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Trips
paths:
  /trips/{trip_id}/fare:
    get:
      summary: "API13 - Tính cước sau khi hoàn thành chuyến"
      operationId: getTripFare
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thông tin cước phí
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareResponse'
        '409':
          description: TRIP_NOT_COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FareResponse:
      type: object
      properties:
        trip_id:
          type: string
        distance_km:
          type: number
        duration_minutes:
          type: integer
        vehicle_type:
          type: string
        total_fare:
          type: number
        currency:
          type: string
          example: VND
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string