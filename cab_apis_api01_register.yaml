openapi: 3.0.0
info:
  title: CAB System API - API01
  summary: Đăng ký tài khoản
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Auth
paths:
  /auth/register:
    post:
      summary: "API01 - Đăng ký tài khoản"
      operationId: registerUser
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: EMAIL_ALREADY_EXISTS / PHONE_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    RegisterRequest:
      type: object
      required: [full_name, phone, password, role]
      properties:
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum: [customer, driver]
    UserResponse:
      type: object
      properties:
        user_id:
          type: string
          example: U1001
        full_name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [customer, driver, operator, admin]
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string