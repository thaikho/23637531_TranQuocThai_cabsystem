openapi: 3.0.0
info:
  title: CAB System API - API04
  summary: Cập nhật hồ sơ & phương tiện tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Drivers
paths:
  /drivers/me/profile:
    put:
      summary: "API04 - Cập nhật hồ sơ & phương tiện tài xế"
      operationId: updateDriverProfile
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                license_number:
                  type: string
                  example: "B2-123456"
                vehicle:
                  $ref: '#/components/schemas/Vehicle'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          description: INVALID_LICENSE / VEHICLE_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Vehicle:
      type: object
      properties:
        plate_number:
          type: string
          example: "51H-123.45"
        vehicle_type:
          type: string
          enum: [2-wheel, 4-seat, 7-seat]
        brand:
          type: string
    DriverResponse:
      type: object
      properties:
        driver_id:
          type: string
        license_number:
          type: string
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        status:
          type: string
          enum: [online, offline, busy]
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string