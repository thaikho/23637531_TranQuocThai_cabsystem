openapi: 3.0.0
info:
  title: CAB System API - API10
  summary: Tài xế nhận / từ chối yêu cầu chuyến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Drivers
paths:
  /drivers/me/ride-requests/{request_id}/respond:
    post:
      summary: "API10 - Tài xế nhận / từ chối yêu cầu chuyến"
      operationId: respondRideRequest
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, reject]
      responses:
        '200':
          description: Phản hồi được ghi nhận
        '409':
          description: REQUEST_EXPIRED / REQUEST_ALREADY_TAKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string