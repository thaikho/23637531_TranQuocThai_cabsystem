openapi: 3.0.0
info:
  title: CAB System API - API19
  summary: Xử lý chuyến gặp sự cố
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Admin
paths:
  /admin/trips/{trip_id}/resolve:
    post:
      summary: "API19 - Xử lý chuyến gặp sự cố"
      operationId: resolveTripIssue
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  example: reassign_driver
                note:
                  type: string
      responses:
        '200':
          description: Sự cố đã được xử lý
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT