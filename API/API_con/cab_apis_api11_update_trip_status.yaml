openapi: 3.0.0
info:
  title: CAB System API - API11
  summary: Cập nhật trạng thái chuyến (tài xế)
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Trips
paths:
  /trips/{trip_id}/status:
    put:
      summary: "API11 - Cập nhật trạng thái chuyến (tài xế)"
      operationId: updateTripStatus
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [arrived_pickup, picked_up, on_trip, completed]
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '409':
          description: INVALID_STATUS_TRANSITION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string