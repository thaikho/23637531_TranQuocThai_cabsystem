openapi: 3.0.0
info:
  title: CAB System API - API07
  summary: Tạo yêu cầu đặt xe
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Bookings
paths:
  /bookings:
    post:
      summary: "API07 - Tạo yêu cầu đặt xe"
      operationId: createBooking
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: INVALID_LOCATION / NO_SERVICE_AREA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Location:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        address:
          type: string
    BookingRequest:
      type: object
      required: [pickup, dropoff, vehicle_type, payment_method]
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        dropoff:
          $ref: '#/components/schemas/Location'
        vehicle_type:
          type: string
          enum: [2-wheel, 4-seat, 7-seat]
        payment_method:
          type: string
          enum: [cash, e-wallet, card]
    BookingResponse:
      type: object
      properties:
        booking_id:
          type: string
          example: BK20260907001
        status:
          type: string
          enum:
            - searching_driver
            - driver_assigned
            - driver_arriving
            - picked_up
            - on_trip
            - completed
            - cancelled
            - no_driver_found
        driver:
          type: object
          properties:
            driver_id:
              type: string
            name:
              type: string
            vehicle_plate:
              type: string
        eta_minutes:
          type: integer
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string