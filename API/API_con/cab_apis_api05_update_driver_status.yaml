openapi: 3.0.0
info:
  title: CAB System API - API05
  summary: Cập nhật trạng thái tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Drivers
paths:
  /drivers/me/status:
    put:
      summary: "API05 - Cập nhật trạng thái tài xế"
      operationId: updateDriverStatus
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [online, offline, busy]
      responses:
        '200':
          description: Cập nhật trạng thái thành công
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT