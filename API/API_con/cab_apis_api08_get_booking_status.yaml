openapi: 3.0.0
info:
  title: CAB System API - API08
  summary: Theo dõi trạng thái yêu cầu đặt xe / chuyến đi
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Bookings
paths:
  /bookings/{booking_id}:
    get:
      summary: "API08 - Theo dõi trạng thái yêu cầu đặt xe / chuyến đi"
      operationId: getBookingStatus
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trạng thái hiện tại của yêu cầu đặt xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          description: BOOKING_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BookingResponse:
      type: object
      properties:
        booking_id:
          type: string
          example: BK20260907001
        status:
          type: string
          enum:
            - searching_driver
            - driver_assigned
            - driver_arriving
            - picked_up
            - on_trip
            - completed
            - cancelled
            - no_driver_found
        driver:
          type: object
          properties:
            driver_id:
              type: string
            name:
              type: string
            vehicle_plate:
              type: string
        eta_minutes:
          type: integer
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string