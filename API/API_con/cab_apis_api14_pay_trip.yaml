openapi: 3.0.0
info:
  title: CAB System API - API14
  summary: Thanh toán chuyến đi
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Payments
paths:
  /trips/{trip_id}/payment:
    post:
      summary: "API14 - Thanh toán chuyến đi"
      operationId: payTrip
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                payment_method:
                  type: string
                  enum: [cash, e-wallet, card]
                provider:
                  type: string
                  example: momo
      responses:
        '200':
          description: Thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '402':
          description: PAYMENT_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: PAYMENT_PROVIDER_TIMEOUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaymentResponse:
      type: object
      properties:
        payment_id:
          type: string
          example: PM20260907001
        status:
          type: string
          enum: [success, failed, pending]
        amount:
          type: number
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string