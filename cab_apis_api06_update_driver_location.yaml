openapi: 3.0.0
info:
  title: CAB System API - API06
  summary: Cập nhật vị trí tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/api/v1
  - url: http://localhost:8080/api/v1
tags:
  - name: Drivers
paths:
  /drivers/me/location:
    post:
      summary: "API06 - Cập nhật vị trí tài xế"
      operationId: updateDriverLocation
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                  format: float
                  example: 10.7769
                lng:
                  type: number
                  format: float
                  example: 106.7009
                heading:
                  type: integer
                  example: 120
                timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Ghi nhận vị trí thành công
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT